<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FLOMIRA — Cakes Made With Love</title>
  <meta name="description" content="Scroll to fly through the world of Flomira." />
  <style>
    /* Theme the engine here. These match your generated scenes' background + palette. */
    :root, .sw-root {
      --sw-bg: #0a0a0a;          /* solid dark black */
      --sw-ink: #ffffff;         /* white text */
      --sw-ink-soft: #aaaaaa;    /* soft gray text */
      --sw-accent: #b76e79;      /* rose gold */
    }
    body {
      background: var(--sw-bg);
      color: var(--sw-ink);
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountLetsScroll(document.getElementById('world'), {
      brand: { name: 'FLOMIRA', href: '#top' },
      cta: { label: 'Order now', href: '#finale' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'ingredients', label: 'The Ingredients',
          still: 'assets/still_1.jpg',
          clip: 'assets/vid/dive_1.mp4',
          accent: '#b76e79',
          eyebrow: 'The foundation',
          title: 'Pure, rich, and authentic.',
          body: 'Starting with the finest raw baking ingredients to ensure every bite is perfection.',
          tags: ['Premium Flour', 'Vanilla Beans'],
        },
        {
          id: 'mixing', label: 'The Craft',
          still: 'assets/still_2.jpg',
          clip: 'assets/vid/dive_2.mp4',
          accent: '#cba0a5',
          eyebrow: 'Made with love',
          title: 'The perfect blend.',
          body: 'Smooth, glossy chocolate cake batter mixed to luxurious perfection.',
          tags: ['Rich Chocolate', 'Silky Batter'],
        },
        {
          id: 'baking', label: 'The Oven',
          still: 'assets/still_3.jpg',
          clip: 'assets/vid/dive_3.mp4',
          accent: '#b76e79',
          eyebrow: 'Warmth and patience',
          title: 'Rising to the occasion.',
          body: 'Warm glowing light illuminating perfectly rising cake layers.',
          tags: ['Freshly Baked', 'Warm Textures'],
        },
        {
          id: 'custom_design', label: 'The Design',
          still: 'assets/still_4.jpg',
          clip: 'assets/vid/dive_4.mp4',
          accent: '#cba0a5',
          eyebrow: 'Intricate details',
          title: 'Cake decorating mastered.',
          body: 'Piping intricate rose gold buttercream ruffles onto dark chocolate tiers.',
          tags: ['Custom Design', 'Artisan Details'],
        },
        {
          id: 'pound_cakes', label: 'Pound Cakes',
          still: 'assets/still_5.jpg',
          clip: 'assets/vid/dive_5.mp4',
          accent: '#b76e79',
          eyebrow: 'A gorgeous assortment',
          title: 'Flavors for every palate.',
          body: 'Sliced pound cakes, macarons, and cupcakes displayed elegantly on a rose gold cake stand.',
          tags: ['Pound Cakes', 'Macarons'],
        },
        {
          id: 'hero', label: 'The Masterpiece',
          still: 'assets/still_6.jpg',
          clip: 'assets/vid/dive_6.mp4',
          accent: '#b76e79',
          eyebrow: 'The Flomira signature',
          title: 'Cakes made with love.',
          body: 'A stunning tiered cake with rose gold drips and delicate buttercream flowers.',
          tags: ['Signature', 'Masterpiece'],
          cta: { primary: { label: 'Order Yours', href: '#' },
                 secondary: { label: 'View Gallery', href: '#' } },
        },
      ],
      connectors: [
        'assets/vid/conn_1.mp4',
        'assets/vid/conn_2.mp4',
        'assets/vid/conn_3.mp4',
        'assets/vid/conn_4.mp4',
        'assets/vid/conn_5.mp4',
      ],
    });
  </script>
</body>
</html>
