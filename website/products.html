<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Products — FLOMIRA</title>
  <meta name="description" content="Explore our delicious cakes and treats." />
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --text-white: #ffffff;
      --text-soft: #aaaaaa;
      --accent: #b76e79;
      --accent-light: #cba0a5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-soft);
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--text-white);
    }

    /* Hero Section */
    .hero {
      padding: 8rem 2rem 4rem;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-soft);
      margin-bottom: 3rem;
    }

    /* Products Grid */
    .products-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(183, 110, 121, 0.2);
    }

    .product-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.05);
    }

    .product-info {
      padding: 1.5rem;
    }

    .product-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-white);
    }

    .product-description {
      color: var(--text-soft);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .product-sizes {
      margin-bottom: 1rem;
    }

    .size-option {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .size-name {
      color: var(--text-soft);
    }

    .size-price {
      color: var(--accent);
      font-weight: 600;
    }

    .allergens {
      margin-top: 1rem;
      padding: 0.5rem;
      background: rgba(255, 165, 0, 0.1);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #ffa500;
    }

    .order-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .order-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(183, 110, 121, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 6rem 2rem;
    }

    .empty-state h2 {
      font-size: 2rem;
      color: var(--text-soft);
      margin-bottom: 1rem;
    }

    .empty-state p {
      color: var(--text-soft);
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.5rem;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">FLOMIRA</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="hero">
    <h1>Our Products</h1>
    <p>Discover our carefully crafted selection of delicious treats</p>
  </div>

  <div class="products-container">
    <div id="products-grid" class="products-grid">
      <!-- Products will be loaded here from Firestore -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <h2>No products available yet</h2>
      <p>Check back soon for our delicious offerings!</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDLu-A21COEdO0iiAqb5aO5Ksd3rF1WEMQ",
      authDomain: "flomiradb.firebaseapp.com",
      projectId: "flomiradb",
      storageBucket: "flomiradb.firebasestorage.app",
      messagingSenderId: "643690719695",
      appId: "1:643690719695:web:c6ae2e9056ca4bc3bfbd7d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
      try {
        const productsSnapshot = await getDocs(collection(db, 'websites/default/products'));
        const products = [];

        productsSnapshot.forEach((doc) => {
          products.push({ id: doc.id, ...doc.data() });
        });

        const grid = document.getElementById('products-grid');
        const emptyState = document.getElementById('empty-state');

        if (products.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const imageUrl = product.images && product.images.length > 0
            ? product.images[0]
            : '';

          const sizesHTML = product.sizes.map(size => `
            <div class="size-option">
              <span class="size-name">${size.name}</span>
              <span class="size-price">${size.price.toFixed(2)} TK</span>
            </div>
          `).join('');

          const allergensHTML = product.allergens && product.allergens.length > 0
            ? `<div class="allergens">⚠️ Contains: ${product.allergens.join(', ')}</div>`
            : '';

          card.innerHTML = `
            ${imageUrl ? `<img src="${imageUrl}" alt="${product.name}" class="product-image" />` : '<div class="product-image"></div>'}
            <div class="product-info">
              <h3 class="product-name">${product.name}</h3>
              ${product.description ? `<p class="product-description">${product.description}</p>` : ''}
              <div class="product-sizes">
                ${sizesHTML}
              </div>
              ${allergensHTML}
              <button class="order-btn" onclick="orderProduct('${product.id}', '${product.name}')">Order Now</button>
            </div>
          `;

          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading products:', error);
        document.getElementById('empty-state').style.display = 'block';
      }
    }

    window.orderProduct = function(productId, productName) {
      alert(`Order functionality coming soon for: ${productName}`);
      // TODO: Integrate with WhatsApp or order system
    };

    loadProducts();
  </script>
</body>
</html>
